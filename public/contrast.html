    <div class="tool-header"><h1>Contrast Checker</h1><p>Test color combinations against WCAG AA and AAA accessibility standards.</p></div>

      <div class="contrast-inputs">
        <div>
          <label class="field-label">Foreground</label>
          <input type="color" id="fgColor" class="color-input color-input--wide" value="#FFFFFF" />
        </div>
        <div>
          <label class="field-label">Background</label>
          <input type="color" id="bgColor" class="color-input color-input--wide" value="#10B981" />
        </div>
      </div>
      <div class="contrast-preview" id="contrastPreview">
        <div>
          <div class="contrast-text-large" id="previewLarge">Large Text Sample (18pt)</div>
          <div class="contrast-text-small" id="previewSmall">Small text sample (14px)</div>
        </div>
      </div>
      <div class="output-panel contrast-results">
        <div class="contrast-score-row">
          <div>
            <div class="field-label">Contrast Ratio</div>
            <div class="contrast-score" id="contrastScore">—</div>
          </div>
          <div id="wcagBadges" class="wcag-badges"></div>
        </div>
      </div>
