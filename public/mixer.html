<body>
  <header class="site-header">
    <a class="logo" href="https://mdothree.com">m<span class="dot">.</span>three</a>

    </nav>
  </header>

  <main class="tool-main">
    <div class="tool-header"><h1>Color Mixer</h1><p>Blend two colors and visualize the mix at any ratio.</p></div>
    <div class="tool-body">
      <div class="mixer-inputs">
        <div>
          <label class="field-label">Color A</label>
          <input type="color" id="colorA" class="color-input color-input--wide" value="#10B981" />
        </div>
        <div>
          <label class="field-label">Color B</label>
          <input type="color" id="colorB" class="color-input color-input--wide" value="#3B82F6" />
        </div>
      </div>
      <div>
        <label class="field-label">Mix Ratio: <span id="ratioVal">50</span>% B</label>
        <input type="range" id="mixRatio" class="slider" min="0" max="100" value="50" />
      </div>
      <div id="mixStrip" class="mix-strip"></div>
      <div class="output-panel">
        <label class="field-label">Mixed Color</label>
        <div id="mixHex" class="mix-hex-display" title="Click to copy"></div>
        <div id="mixPreview" class="mix-preview-swatch"></div>
      </div>
      <div class="action-row">
        <button class="btn-ghost" id="copyMix">⎘ Copy hex</button>
      </div>
    </div>
  </main>

  <script src="js/pages/mixer.js" type="module"></script>

  <script>
    if ('serviceWorker' in navigator) {
